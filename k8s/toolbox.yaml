# Toolbox fixa no cluster, com permissão SOMENTE LEITURA.
# Troque a imagem em "image:" pela sua (ex.: ghcr.io/<usuario>/k8s-toolbox:1.0.0).
apiVersion: v1
kind: Namespace
metadata:
  name: toolbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toolbox
  namespace: toolbox
---
# Leitura de recursos com namespace: usa o ClusterRole "view" que já vem no Kubernetes
# (pods, logs, services, deployments, ingress, pvc, events, configmaps... NÃO inclui secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toolbox-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: toolbox
    namespace: toolbox
---
# Extra: recursos de cluster que o "view" não cobre (nodes, PVs, storageclasses, métricas)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toolbox-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toolbox-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toolbox-cluster-read
subjects:
  - kind: ServiceAccount
    name: toolbox
    namespace: toolbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: toolbox
  labels:
    app: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
    spec:
      serviceAccountName: toolbox
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toolbox
          image: k8s-toolbox:dev   # <- troque pela sua imagem
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      # Se a imagem estiver em registry privado:
      # imagePullSecrets:
      #   - name: registry-cred
